# Standalone crate (not a workspace member). `build-variants.sh` copies this manifest per
# variant with the `object_store` path rewritten to that variant's worktree; this copy
# builds against the enclosing checkout so that `cargo fmt`/`cargo clippy` work here.

[package]
name = "dirsync-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "dirsync-bench"
path = "src/main.rs"

[features]
default = ["ext-trait", "with-fsync"]
# object_store >= 0.13: `put`/`put_multipart` live on `ObjectStoreExt`.
ext-trait = []
# The rev has `LocalFileSystem::with_fsync` (fork branches, upstream >= 0.14).
with-fsync = []

[dependencies]
object_store = { path = "../..", default-features = false, features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
hdrhistogram = { version = "7", default-features = false }

[profile.release]
debug = false
